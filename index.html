<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Flip-Fun - Memory Game for Kids</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Fredoka', sans-serif;
            background: #000;
            overflow: hidden;
            position: fixed;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== START SCREEN ===== */
        #startScreen {
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #FFD700 100%);
            z-index: 10;
            overflow: hidden;
            top: 0;
            left: 0;
        }

        /* Animated clouds */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 100px;
            opacity: 0.7;
            animation: float-cloud 15s infinite;
        }

        .cloud:nth-child(1) {
            width: 100px;
            height: 40px;
            top: 15%;
            left: -100px;
            animation-delay: 0s;
        }

        .cloud:nth-child(2) {
            width: 80px;
            height: 35px;
            top: 25%;
            right: -80px;
            animation-delay: 5s;
        }

        .cloud:nth-child(3) {
            width: 120px;
            height: 50px;
            top: 35%;
            left: -120px;
            animation-delay: 10s;
        }

        @keyframes float-cloud {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 200px)); }
        }

        /* Sun */
        .sun {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 35% 35%, #FFD700, #FFA500);
            border-radius: 50%;
            top: 10%;
            right: 10%;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
            animation: sun-pulse 3s ease-in-out infinite;
        }

        @keyframes sun-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Tree */
        .tree {
            position: absolute;
            bottom: 0;
        }

        .tree-trunk {
            width: 40px;
            height: 80px;
            background: linear-gradient(to right, #8B4513, #A0522D);
            margin-left: 30px;
        }

        .tree-leaves {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle at 30% 30%, #90EE90, #228B22);
            border-radius: 50%;
            position: relative;
        }

        .tree.left {
            left: 5%;
        }

        .tree.right {
            right: 5%;
        }

        #emojiBoard {
            position: absolute;
            width: min(90vw, 380px);
            height: min(90vw, 380px);
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 8px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            animation: board-float 4s ease-in-out infinite;
            top: 8%;
            z-index: 5;
        }

        @keyframes board-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .cell {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(16px, 4vw, 28px);
            animation: cell-bounce 1.5s ease-in-out infinite;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cell:active {
            background: rgba(255, 255, 255, 0.35);
            transform: scale(0.95);
        }

        @keyframes cell-bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .game-title {
            font-family: 'Bangers', cursive;
            font-size: clamp(50px, 12vw, 90px);
            color: white;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3), 0 0 30px rgba(255, 215, 0, 0.5);
            z-index: 6;
            margin: 20px 0;
            animation: title-pulse 2s ease-in-out infinite;
            letter-spacing: 3px;
        }

        @keyframes title-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .play-btn {
            font-size: clamp(16px, 4vw, 28px);
            padding: clamp(14px, 3vw, 20px) clamp(40px, 10vw, 80px);
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ffdd00, #ff7b00);
            color: #000;
            font-weight: bold;
            z-index: 6;
            cursor: pointer;
            animation: button-pulse 1.2s infinite;
            box-shadow: 0 10px 30px rgba(255, 123, 0, 0.5);
            transition: all 0.2s;
            font-family: 'Fredoka', sans-serif;
            letter-spacing: 1px;
        }

        .play-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(255, 123, 0, 0.7);
        }

        @keyframes button-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* ===== LEVEL SCREEN ===== */
        #levelScreen {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #FFD700 0%, #87CEEB 50%, #90EE90 100%);
            padding: clamp(15px, 4vw, 30px);
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 10;
            top: 0;
            left: 0;
        }

        #levelScreen h1 {
            font-family: 'Bangers', cursive;
            font-size: clamp(32px, 8vw, 60px);
            color: white;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            margin: 20px 0 30px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(65px, 1fr));
            gap: 10px;
            max-width: 90vw;
            margin: 0 auto 40px;
        }

        .level-btn {
            padding: clamp(12px, 3vw, 16px);
            border-radius: 15px;
            border: none;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            font-size: clamp(14px, 3vw, 16px);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(255, 165, 0, 0.3);
            font-family: 'Fredoka', sans-serif;
            min-height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .level-btn:active:not(.locked) {
            transform: scale(0.95);
            box-shadow: 0 8px 20px rgba(255, 165, 0, 0.5);
        }

        .level-btn.locked {
            background: linear-gradient(135deg, #999, #666);
            color: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* ===== GAME SCREEN ===== */
        #gameScreen {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #FFD700 0%, #87CEEB 50%, #90EE90 100%);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
            top: 0;
            left: 0;
            padding: clamp(10px, 2vw, 15px);
            overflow: hidden;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 95vw;
            margin-bottom: clamp(10px, 2vw, 15px);
            padding: 0 10px;
        }

        #levelTitle {
            font-family: 'Bangers', cursive;
            font-size: clamp(20px, 5vw, 40px);
            color: white;
            text-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
            font-weight: bold;
            margin: 0;
        }

        .timer {
            font-size: clamp(18px, 4vw, 28px);
            font-weight: bold;
            color: #ff0000;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            background: rgba(255, 255, 255, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
        }

        #gameBoard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: clamp(8px, 2vw, 12px);
            padding: clamp(15px, 3vw, 20px);
            background: rgba(139, 90, 43, 0.7);
            border-radius: 25px;
            border: 4px solid #5c3b1e;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(0, 0, 0, 0.2);
            max-width: 90vw;
            aspect-ratio: 1;
        }

        .tile {
            aspect-ratio: 1;
            cursor: pointer;
            perspective: 1000px;
            min-width: 50px;
        }

        .tile-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform-style: preserve-3d;
        }

        .tile.flipped .tile-inner {
            transform: rotateY(180deg);
        }

        .tile-face {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            font-size: clamp(28px, 8vw, 42px);
            backface-visibility: hidden;
            font-weight: bold;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.2);
        }

        .tile-front {
            background: linear-gradient(135deg, #d2a679, #e6c9a0);
            color: #8b5a2b;
            font-size: clamp(18px, 5vw, 24px);
        }

        .tile-back {
            background: linear-gradient(135deg, #fff3d1, #ffe8a0);
            transform: rotateY(180deg);
        }

        .game-controls {
            display: flex;
            gap: 8px;
            margin-top: clamp(15px, 3vw, 25px);
            flex-wrap: wrap;
            justify-content: center;
            max-width: 95vw;
        }

        .game-controls button {
            padding: clamp(10px, 2vw, 14px) clamp(15px, 3vw, 20px);
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: clamp(12px, 3vw, 14px);
            font-family: 'Fredoka', sans-serif;
            box-shadow: 0 5px 12px rgba(255, 165, 0, 0.3);
        }

        .game-controls button:active {
            transform: scale(0.95);
        }

        /* ===== WIN SCREEN ===== */
        #winScreen {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 999;
            top: 0;
            left: 0;
        }

        .win-box {
            background: linear-gradient(135deg, #ffdd00, #ff7b00, #ff1493);
            padding: clamp(30px, 5vw, 50px);
            border-radius: 30px;
            text-align: center;
            color: white;
            animation: win-pop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            max-width: 90vw;
        }

        @keyframes win-pop {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .win-box h1 {
            font-family: 'Bangers', cursive;
            font-size: clamp(36px, 8vw, 70px);
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .win-box p {
            font-size: clamp(16px, 4vw, 22px);
            margin: 10px 0;
            font-weight: bold;
        }

        .win-box button {
            margin: 8px;
            padding: clamp(12px, 2vw, 15px) clamp(20px, 5vw, 30px);
            font-size: clamp(14px, 3vw, 16px);
            border: none;
            border-radius: 15px;
            background: white;
            color: #ff7b00;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            font-family: 'Fredoka', sans-serif;
        }

        .win-box button:active {
            transform: scale(0.95);
        }

        /* ===== LOSE SCREEN ===== */
        #loseScreen {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 999;
            top: 0;
            left: 0;
        }

        .lose-box {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            padding: clamp(30px, 5vw, 50px);
            border-radius: 30px;
            text-align: center;
            color: white;
            animation: lose-shake 0.4s;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            max-width: 90vw;
        }

        @keyframes lose-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15px); }
            75% { transform: translateX(15px); }
        }

        .lose-box h1 {
            font-family: 'Bangers', cursive;
            font-size: clamp(36px, 8vw, 70px);
            margin-bottom: 15px;
            font-weight: bold;
        }

        .lose-box p {
            font-size: clamp(16px, 4vw, 20px);
            margin: 15px 0;
            font-weight: bold;
        }

        .lose-box button {
            margin: 8px;
            padding: clamp(12px, 2vw, 15px) clamp(20px, 5vw, 30px);
            font-size: clamp(14px, 3vw, 16px);
            border: none;
            border-radius: 15px;
            background: white;
            color: #ee5a6f;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Fredoka', sans-serif;
        }

        .lose-box button:active {
            transform: scale(0.95);
        }

        /* ===== CONFETTI ===== */
        #confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 998;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 0, 0.5);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 215, 0, 0.8);
        }

        /* ===== MOBILE OPTIMIZATION ===== */
        @media (max-width: 768px) {
            #gameBoard {
                grid-template-columns: repeat(4, 1fr);
            }

            .level-grid {
                grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
                gap: 8px;
            }
        }

        @media (max-width: 480px) {
            #gameBoard {
                grid-template-columns: repeat(4, 1fr);
                gap: 6px;
            }

            .level-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 6px;
            }

            #levelScreen h1 {
                margin: 15px 0 20px;
            }

            #emojiBoard {
                grid-template-columns: repeat(5, 1fr);
                grid-template-rows: repeat(5, 1fr);
            }
        }
    </style>
</head>
<body>

<!-- START SCREEN -->
<div id="startScreen">
    <div class="sun"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
    
    <div id="emojiBoard"></div>
    
    <h1 class="game-title">FLIP-FUN</h1>
    <button class="play-btn" onclick="goToLevels()">🎮 PLAY 🎮</button>
    
    <div class="tree left">
        <div class="tree-leaves"></div>
        <div class="tree-trunk"></div>
    </div>
    
    <div class="tree right">
        <div class="tree-leaves"></div>
        <div class="tree-trunk"></div>
    </div>
</div>

<!-- LEVEL SCREEN -->
<div id="levelScreen">
    <h1>🎯 Select Your Level 🎯</h1>
    <div class="level-grid" id="levelGrid"></div>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen">
    <div class="game-header">
        <h2 id="levelTitle">Level 1</h2>
        <div class="timer" id="timer">⏳ 2:00</div>
    </div>
    <div id="gameBoard"></div>
    <div class="game-controls">
        <button onclick="pauseGame()">⏸ Pause</button>
        <button onclick="restartGame()">🔄 Restart</button>
        <button onclick="goToLevels()">📋 Levels</button>
    </div>
</div>

<!-- WIN SCREEN -->
<div id="winScreen">
    <canvas id="confetti"></canvas>
    <div class="win-box">
        <h1>🎉 AMAZING! 🎉</h1>
        <p id="coinText">🪙 +10 Coins!</p>
        <button onclick="nextLevel()">⭐ Next Level ⭐</button>
        <button onclick="goToLevels()">📋 Select Level 📋</button>
    </div>
</div>

<!-- LOSE SCREEN -->
<div id="loseScreen">
    <div class="lose-box">
        <h1>⏰ TIME'S UP! ⏰</h1>
        <p>Don't worry, try again!</p>
        <button onclick="restartGame()">🔄 Retry</button>
        <button onclick="goToLevels()">📋 Select Level 📋</button>
    </div>
</div>

<script>
    // ===== GAME STATE =====
    let gameState = {
        currentLevel: 1,
        unlockedLevel: parseInt(localStorage.getItem('unlockedLevel')) || 1,
        coins: parseInt(localStorage.getItem('coins')) || 0,
        selected: [],
        gameRunning: false,
        gamePaused: false,
        timeLeft: 0,
        timerInterval: null
    };

    const emojis = ['🍎', '🍌', '🍇', '🍒', '🍉', '🍍', '🥝', '🍑'];
    const startEmojis = ['🍎', '🍌', '🍇', '🍒', '🍉', '🍍', '🥝', '🍑', '🐱', '🐶', '⚽', '🚗', '🎈', '🎨', '🌟', '🎪'];

    // ===== INITIALIZATION =====
    function initializeStartScreen() {
        const board = document.getElementById('emojiBoard');
        board.innerHTML = '';
        for (let i = 0; i < 36; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.textContent = startEmojis[Math.floor(Math.random() * startEmojis.length)];
            board.appendChild(cell);
        }
    }

    initializeStartScreen();

    // ===== NAVIGATION =====
    function goToLevels() {
        clearGameTimer();
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('levelScreen').style.display = 'block';
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('winScreen').style.display = 'none';
        document.getElementById('loseScreen').style.display = 'none';
        generateLevelGrid();
    }

    function startGame(level) {
        if (level > gameState.unlockedLevel) return;
        
        gameState.currentLevel = level;
        gameState.selected = [];
        gameState.gameRunning = true;
        gameState.gamePaused = false;
        
        document.getElementById('levelScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'flex';
        document.getElementById('winScreen').style.display = 'none';
        document.getElementById('loseScreen').style.display = 'none';
        
        document.getElementById('levelTitle').textContent = 'Level ' + level;
        createGameBoard();
        startGameTimer();
    }

    function nextLevel() {
        if (gameState.currentLevel < 100) {
            startGame(gameState.currentLevel + 1);
        } else {
            alert('🏆 Congratulations! You completed all 100 levels!');
            goToLevels();
        }
    }

    function restartGame() {
        startGame(gameState.currentLevel);
    }

    function pauseGame() {
        gameState.gamePaused = !gameState.gamePaused;
    }

    // ===== LEVEL GENERATION =====
    function generateLevelGrid() {
        const grid = document.getElementById('levelGrid');
        grid.innerHTML = '';
        
        for (let i = 1; i <= 100; i++) {
            const btn = document.createElement('button');
            btn.className = 'level-btn';
            
            if (i <= gameState.unlockedLevel) {
                btn.textContent = i;
                btn.onclick = () => startGame(i);
            } else {
                btn.textContent = '🔒';
                btn.className = 'level-btn locked';
            }
            
            grid.appendChild(btn);
        }
    }

    // ===== GAME BOARD =====
    function createGameBoard() {
        const board = document.getElementById('gameBoard');
        board.innerHTML = '';
        gameState.selected = [];
        
        let tiles = [];
        for (let i = 0; i < 8; i++) {
            tiles.push(emojis[i], emojis[i]);
        }
        tiles.sort(() => Math.random() - 0.5);
        
        tiles.forEach((emoji, index) => {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.innerHTML = `
                <div class="tile-inner">
                    <div class="tile-face tile-front">❓</div>
                    <div class="tile-face tile-back">${emoji}</div>
                </div>
            `;
            
            tile.dataset.emoji = emoji;
            tile.dataset.index = index;
            tile.onclick = () => flipTile(tile);
            
            board.appendChild(tile);
        });
    }

    function flipTile(tile) {
        if (gameState.gamePaused || gameState.selected.length >= 2 || tile.classList.contains('flipped')) return;
        
        tile.classList.add('flipped');
        gameState.selected.push(tile);
        
        if (gameState.selected.length === 2) {
            setTimeout(checkMatch, 600);
        }
    }

    function checkMatch() {
        const [tile1, tile2] = gameState.selected;
        const match = tile1.dataset.emoji === tile2.dataset.emoji;
        
        if (!match) {
            tile1.classList.remove('flipped');
            tile2.classList.remove('flipped');
        }
        
        gameState.selected = [];
        checkWin();
    }

    function checkWin() {
        const allTiles = document.querySelectorAll('.tile');
        const flippedTiles = document.querySelectorAll('.tile.flipped');
        
        if (allTiles.length === flippedTiles.length && flippedTiles.length > 0) {
            showWinScreen();
        }
    }

    // ===== WIN/LOSE SCREENS =====
    function showWinScreen() {
        clearGameTimer();
        gameState.gameRunning = false;
        
        gameState.coins += 10;
        localStorage.setItem('coins', gameState.coins);
        
        if (gameState.currentLevel === gameState.unlockedLevel && gameState.unlockedLevel < 100) {
            gameState.unlockedLevel++;
            localStorage.setItem('unlockedLevel', gameState.unlockedLevel);
        }
        
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('winScreen').style.display = 'flex';
        document.getElementById('coinText').textContent = '🪙 +10 Coins! Total: ' + gameState.coins + ' 🪙';
        
        startConfetti();
    }

    function showLoseScreen() {
        clearGameTimer();
        gameState.gameRunning = false;
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('loseScreen').style.display = 'flex';
    }

    // ===== TIMER =====
    function getTimeLimit(level) {
        if (level <= 30) return 120;
        if (level <= 70) return 240;
        return 300;
    }

    function startGameTimer() {
        clearGameTimer();
        gameState.timeLeft = getTimeLimit(gameState.currentLevel);
        updateTimerDisplay();
        
        gameState.timerInterval = setInterval(() => {
            if (gameState.gamePaused) return;
            
            gameState.timeLeft--;
            updateTimerDisplay();
            
            if (gameState.timeLeft <= 0) {
                showLoseScreen();
            }
        }, 1000);
    }

    function clearGameTimer() {
        if (gameState.timerInterval) {
            clearInterval(gameState.timerInterval);
            gameState.timerInterval = null;
        }
    }

    function updateTimerDisplay() {
        const mins = Math.floor(gameState.timeLeft / 60);
        const secs = gameState.timeLeft % 60;
        document.getElementById('timer').textContent = `⏳ ${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // ===== CONFETTI =====
    function startConfetti() {
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const particles = [];
        for (let i = 0; i < 100; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 5 + 2,
                vx: (Math.random() - 0.5) * 8,
                vy: Math.random() * 5 + 3,
                color: 'hsl(' + Math.random() * 360 + ', 100%, 50%)'
            });
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(p => {
                p.y += p.vy;
                p.x += p.vx;
                p.vy += 0.1;
                
                if (p.y > canvas.height) p.y = -10;
                if (p.x > canvas.width) p.x = -10;
                if (p.x < 0) p.x = canvas.width;
                
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
            
            requestAnimationFrame(animate);
        }
        
        animate();
    }

    // Prevent zoom on double tap
    document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1) {
            e.preventDefault();
        }
    }, { passive: false });
</script>
