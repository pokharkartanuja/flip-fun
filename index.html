<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Flip-Fun</title>

<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:"Segoe UI Emoji",sans-serif;
  color:white;
  text-align:center;
  background:#000;
  overflow:hidden;
}

/* ================= START SCREEN ================= */
#startScreen{
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:10;
  overflow:hidden;

  
  background:url(blue.jpg)center/cover no-repeat;
  background-size: 400% 400%;
  animation: none;
}

@keyframes bgFlow{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

#startScreen::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background: repeating-linear-gradient(
    120deg,
    rgba(255,255,255,0.08),
    rgba(255,255,255,0.08) 2px,
    transparent 2px,
    transparent 40px
  );
  animation: streakMove 6s linear infinite;
  transform: rotate(10deg);
}

@keyframes streakMove{
  from{transform:translateX(0) rotate(10deg);}
  to{transform:translateX(-200px) rotate(10deg);}
}

#emojiBoard{
  position:absolute;
  width:600px;
  height:600px;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  grid-template-rows:repeat(6,1fr);
  gap:10px;
  padding:15px;
  background:rgba(255,255,255,0.08);
  border-radius:35px;
  backdrop-filter: blur(6px);
}

.cell{
  background:rgba(255,255,255,0.15);
  border-radius:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
}

.game-title{
  font-family:'Bangers', cursive;
  font-size:90px;
  text-shadow:0 0 25px #00e5ff;
  z-index:2;
}

.play-btn{
  font-size:24px;
  padding:16px 60px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  background:linear-gradient(135deg,#ffdd00,#ff7b00);
  color:#000;
  font-weight:bold;
  z-index:2;
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.1);}
  100%{transform:scale(1);}
}

/* ================= LEVEL SCREEN ================= */
#levelScreen{
  display:none;
  position:fixed;
  width:100%;
  height:100%;
  background:url(fruit.jpg)center/cover no-repeat;
  
  overflow:auto;
  padding:20px;
}

.level-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  max-width:500px;
  margin:auto;
}

.level{
  padding:15px;
  border-radius:10px;
  background:rgba(83, 80, 80, 0.733);
  cursor:pointer;
}

/* ================= GAME ================= */
#gameScreen{
  display:none;
  position:fixed;
  width:100%;
  height:100%;
  background:url(fruit.jpg)center/cover no-repeat;
 
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

#woodBoard{
  width:420px;
  height:420px;
  background:#8b5a2b;
  border:12px solid #5c3b1e;
  border-radius:20px;
  display:grid;
  gap:8px;
  padding:15px;
}

.tile{
  perspective:1000px;
  width:70px;
  height:70px;
  cursor:pointer;
}

.inner{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform 0.6s;
}

.tile.flipped .inner{
  transform:rotateY(180deg);
}

.face{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:8px;
  backface-visibility:hidden;
}

.front{background:#d2a679;}
.back{
  background:#fff3d1;
  transform:rotateY(180deg);
}

/* ================= WIN ================= */
#winScreen{
  position:fixed;
  width:100%;
  height:100%;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,0.85);
  z-index:999;
}

.winBox{
  background:linear-gradient(135deg,#ffdd00,#ff7b00);
  padding:40px;
  border-radius:20px;
  color:black;
  position: relative;
  z-index:10000 ;
}

#confettiCanvas{
  position:absolute;
  width:100%;
  height:100%;
  pointer-events:none ;
}

.sparkle{
  position:absolute;
  font-size:25px;
  animation:spark 1s linear forwards;
}

@keyframes spark{
  from{
    opacity:1;
    transform:scale(0);
  }
  to{
    opacity:0;
    transform:translateY(-80px) scale(2);
  }
}
</style>
</head>

<body>

<!-- START -->
<div id="startScreen">
  <div id="emojiBoard"></div>
  <div class="game-title">FLIP-FUN</div>
  <button class="play-btn" onclick="showLevels()">PLAY</button>
</div>

<!-- LEVELS -->
<div id="levelScreen">
  <h1>Select Level</h1>
  <div class="level-grid" id="levelGrid"></div>
</div>

<!-- GAME -->
<div id="gameScreen">
  <h2 id="levelTitle"></h2>
  <div id="woodBoard"></div>
</div>

<!-- WIN -->
<div id="winScreen">
  <canvas id="confettiCanvas"></canvas>
  <div class="winBox">
    <h1>🎉 Level Complete!</h1>
    <button onclick="nextLevel()">Next</button>
    <button onclick="backToLevels()">Levels</button>
  </div>
</div>

<script>

/* ================= START BOARD ================= */
const startEmojis=["🍎","🍌","🍇","🍒","🍉","🍍","🥝","🍑","🐱","🐶","⚽","🚗"];
const board=document.getElementById("emojiBoard");

for(let i=0;i<36;i++){
  let d=document.createElement("div");
  d.className="cell";
  d.innerText=startEmojis[Math.floor(Math.random()*startEmojis.length)];
  board.appendChild(d);
}

/* ================= DATA ================= */
const emojis=["🍎","🍌","🍇","🍒","🍉","🍍","🥝","🍑"];

let selected=[];
let currentLevel=1;

let coins = parseInt(localStorage.getItem("coins") || "0");

/* ✅ FIX: ONLY LEVEL 1 UNLOCKED INITIALLY */
let unlockedLevel = parseInt(localStorage.getItem("unlockedLevel") || "1");
if(!localStorage.getItem("unlockedLevel")){
  unlockedLevel = 1;
}

/* ================= NAV ================= */
function showLevels(){
  document.getElementById("startScreen").style.display="none";
  document.getElementById("levelScreen").style.display="block";
  generateLevels();
}

function backToLevels(){
  document.getElementById("winScreen").style.display="none";
  document.getElementById("gameScreen").style.display="none";
  document.getElementById("levelScreen").style.display="block";
  selected=[];
  generateLevels();
}

/* ================= LEVELS ================= */
function generateLevels(){
  let grid=document.getElementById("levelGrid");
  grid.innerHTML="";

  for(let i=1;i<=100;i++){
    let d=document.createElement("div");
    d.className="level";

    if(i<=unlockedLevel){
      d.innerText="Level "+i;
      d.onclick=()=>startLevel(i);
    }else{
      d.innerText="🔒 "+i;
      d.onclick=()=>alert("Locked!");
    }

    grid.appendChild(d);
  }
}

/* ================= GAME ================= */
function startLevel(level){
  if(level>unlockedLevel) return;

  currentLevel=level;

  document.getElementById("levelScreen").style.display="none";
  document.getElementById("gameScreen").style.display="flex";
  document.getElementById("levelTitle").innerText="Level "+level;

  let board=document.getElementById("woodBoard");
  board.innerHTML="";
  selected=[];

  let arr=[];
  for(let i=0;i<8;i++) arr.push(emojis[i],emojis[i]);
  arr.sort(()=>0.5-Math.random());

  board.style.gridTemplateColumns="repeat(4,1fr)";

  arr.forEach(e=>{
    let tile=document.createElement("div");
    tile.className="tile";

    tile.innerHTML=`
      <div class="inner">
        <div class="face front">❓</div>
        <div class="face back">${e}</div>
      </div>
    `;

    tile.onclick=()=>{
      if(tile.classList.contains("flipped")) return;

      tile.classList.add("flipped");
      selected.push({tile,e});

      if(selected.length===2){
        setTimeout(checkMatch,600);
      }
    };

    board.appendChild(tile);
  });
}

/* ================= MATCH ================= */
function checkMatch(){
  let[a,b]=selected;

  if(a.e!==b.e){
    a.tile.classList.remove("flipped");
    b.tile.classList.remove("flipped");
  }

  selected=[];
  checkWin();
}

/* ================= WIN CHECK ================= */
function checkWin(){
  let all=document.querySelectorAll(".tile");
  let flipped=document.querySelectorAll(".tile.flipped");

  if(flipped.length===all.length){
    showWin();
  }
}

/* ================= FIXED WIN LOGIC ================= */
function showWin(){
  document.getElementById("winScreen").style.display="flex";
  startConfetti();

  if(unlockedLevel === currentLevel && unlockedLevel < 100){
    unlockedLevel++;
    localStorage.setItem("unlockedLevel",unlockedLevel);
  }
}

/* ================= FIXED NEXT BUTTON ================= */
function nextLevel(){
  document.getElementById("winScreen").style.display="none";
  document.getElementById("gameScreen").style.display="none";
  selected=[];
  startLevel(currentLevel+1);
}

/* ================= CONFETTI ================= */
let ctx,particles=[];

function startConfetti(){
  let canvas=document.getElementById("confettiCanvas");
  ctx=canvas.getContext("2d");

  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;

  particles=[];

  for(let i=0;i<120;i++){
    particles.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height,
      r:Math.random()*6
    });
  }

  animate();
}

function animate(){
  ctx.clearRect(0,0,window.innerWidth,window.innerHeight);

  particles.forEach(p=>{
    p.y+=3;
    if(p.y>window.innerHeight) p.y=0;

    ctx.fillStyle="hsl("+Math.random()*360+",100%,50%)";
    ctx.fillRect(p.x,p.y,p.r,p.r);
  });

  requestAnimationFrame(animate);
}

</script>

<script>
/* ===================== GLOBAL GAME ADD-ON SYSTEM ===================== */

/* ---------- SOUND SYSTEM ---------- */
let soundEnabled = true;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playClickSound(){
  if(!soundEnabled) return;
  let osc = audioCtx.createOscillator();
  let gain = audioCtx.createGain();

  osc.type = "triangle";
  osc.frequency.value = 600;

  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.2);
}

/* override clicks globally */
document.addEventListener("click", playClickSound, true);

/* ---------- HOME + SOUND BUTTONS (START SCREEN) ---------- */
function addStartScreenButtons(){
  const start = document.getElementById("startScreen");

  let box = document.createElement("div");
  box.style.position = "absolute";
  box.style.bottom = "20px";
  box.style.right = "20px";
  box.style.display = "flex";
  box.style.gap = "10px";

  let homeBtn = document.createElement("button");
  homeBtn.innerText = "🏠";
  homeBtn.style.padding = "10px";
  homeBtn.style.borderRadius = "10px";
  homeBtn.onclick = () => location.reload();

  let soundBtn = document.createElement("button");
  soundBtn.innerText = "🔊";
  soundBtn.style.padding = "10px";
  soundBtn.style.borderRadius = "10px";

  soundBtn.onclick = () => {
    soundEnabled = !soundEnabled;
    soundBtn.innerText = soundEnabled ? "🔊" : "🔇";
  };

  box.appendChild(homeBtn);
  box.appendChild(soundBtn);
  start.appendChild(box);
}
addStartScreenButtons();

/* ---------- LEVEL PAGINATION SYSTEM (NEW UI) ---------- */
let levelPage = 0;
const levelsPerPage = 10;

/* store original function */
const _generateLevels = generateLevels;

generateLevels = function(){
  let grid = document.getElementById("levelGrid");
  grid.innerHTML = "";

  let start = levelPage * levelsPerPage + 1;
  let end = start + levelsPerPage - 1;

  /* BIG BOARD WRAPPER */
  let wrapper = document.createElement("div");
  wrapper.style.width = "420px";
  wrapper.style.margin = "20px auto";
  wrapper.style.padding = "20px";
  wrapper.style.background = "rgba(255,255,255,0.08)";
  wrapper.style.borderRadius = "20px";
  wrapper.style.position = "relative";

  let miniGrid = document.createElement("div");
  miniGrid.style.display = "grid";
  miniGrid.style.gridTemplateColumns = "repeat(5,1fr)";
  miniGrid.style.gap = "10px";

  for(let i=start;i<=end && i<=100;i++){
    let d = document.createElement("div");
    d.innerText = i;
    d.style.padding = "15px";
    d.style.borderRadius = "10px";
    d.style.background = i <= unlockedLevel ? "#fff3d1" : "#444";
    d.style.color = "#000";
    d.style.cursor = i <= unlockedLevel ? "pointer" : "not-allowed";

    if(i <= unlockedLevel){
      d.onclick = () => startLevel(i);
    }

    miniGrid.appendChild(d);
  }

  wrapper.appendChild(miniGrid);

  /* arrows */
  let left = document.createElement("button");
  left.innerText = "《";
  left.style.position = "absolute";
  left.style.left = "-50px";
  left.style.top = "50%";
  left.onclick = () => {
    if(levelPage > 0){
      levelPage--;
      generateLevels();
    }
  };

  let right = document.createElement("button");
  right.innerText = "》";
  right.style.position = "absolute";
  right.style.right = "-50px";
  right.style.top = "50%";
  right.onclick = () => {
    if((levelPage+1)*levelsPerPage < 100){
      levelPage++;
      generateLevels();
    }
  };

  wrapper.appendChild(left);
  wrapper.appendChild(right);

  grid.appendChild(wrapper);
};

function addTopButtons(){
  let box = document.createElement("div");

  box.innerHTML = `
    <button onclick="location.reload()">🏠</button>
    <button onclick="document.getElementById('gameScreen').style.display='none';document.getElementById('levelScreen').style.display='block'">🔙</button>
  `;

  box.style.position = "fixed";
  box.style.top = "10px";
  box.style.left = "10px";
  box.style.display = "flex";
  box.style.gap = "10px";

  document.body.appendChild(box);
}
addTopButtons();

/* ---------- GAME PAUSE + TIMER SYSTEM ---------- */
let gamePaused = false;
let levelTime = 0;
let timerInterval = null;

function getTimeByLevel(lv){
  if(lv <= 30) return 120;   // 2 min
  if(lv <= 70) return 240;   // 4 min
  return 300;               // 5 min
}

/* override startLevel */
const _startLevel = startLevel;

startLevel = function(level){
  _startLevel(level);

  clearInterval(timerInterval);
  gamePaused = false;

  levelTime = getTimeByLevel(level);

  let oldTimer = document.getElementById("timerBox");
  if(oldTimer) oldTimer.remove();

  let timerBox = document.createElement("div");
  timerBox.id = "timerBox";
  timerBox.style.position = "absolute";
  timerBox.style.top = "10px";
  timerBox.style.color = "white";
  timerBox.style.fontSize = "20px";
  document.getElementById("gameScreen").appendChild(timerBox);
  

  timerInterval = setInterval(() => {
    if(gamePaused) return;

    levelTime--;

    let m = Math.floor(levelTime/60);
    let s = levelTime%60;

    timerBox.innerText = `⏳ ${m}:${s<10?"0"+s:s}`;

    if(levelTime <= 0){
      clearInterval(timerInterval);
      showLose();
    }
  },1000);
};

/* ---------- GAME SCREEN BUTTONS ---------- */
function injectGameButtons(){
  const game = document.getElementById("gameScreen");

  let box = document.createElement("div");
  box.style.position = "absolute";
  box.style.top = "10px";
  box.style.right = "10px";
  box.style.display = "flex";
  box.style.gap = "10px";

  let pauseBtn = document.createElement("button");
  pauseBtn.innerText = "⏸";
  pauseBtn.onclick = () => gamePaused = !gamePaused;

  let restartBtn = document.createElement("button");
  restartBtn.innerText = "🔄";
  restartBtn.onclick = () => startLevel(currentLevel);

  box.appendChild(pauseBtn);
  box.appendChild(restartBtn);
  game.appendChild(box);
}
injectGameButtons();

function addTopButtons(){
  let box = document.createElement("div");

  box.innerHTML = `
    <button onclick="location.reload()">🏠</button>
    <button onclick="document.getElementById('gameScreen').style.display='none';document.getElementById('levelScreen').style.display='block'">🔙</button>
  `;

  box.style.position = "fixed";
  box.style.top = "10px";
  box.style.left = "10px";
  box.style.display = "flex";
  box.style.gap = "10px";

  document.body.appendChild(box);
}
addTopButtons();

/* ---------- WIN / LOSE OVERRIDE UI ---------- */
/* ================= FIXED LOSE ================= */

function showLose(){

  clearInterval(timerInterval);

  let oldLose = document.getElementById("loseScreen");
  if(oldLose) oldLose.remove();

  let lose = document.createElement("div");
  lose.id = "loseScreen";

  lose.style.position = "fixed";
  lose.style.top = "0";
  lose.style.left = "0";
  lose.style.width = "100%";
  lose.style.height = "100%";
  lose.style.background = "rgba(0,0,0,0.9)";
  lose.style.display = "flex";
  lose.style.justifyContent = "center";
  lose.style.alignItems = "center";
  lose.style.zIndex = "99999";

  lose.innerHTML = `
    <div style="
      background:white;
      color:black;
      padding:30px;
      border-radius:20px;
      text-align:center;
    ">
      <h1>❌ You Lost!</h1>

      <button id="retryBtn">🔄 Retry</button>
      <button id="levelsBtn">📋 Levels</button>

    </div>
  `;

  document.body.appendChild(lose);

  document.getElementById("retryBtn").addEventListener("click", () => {
    lose.remove();
    startLevel(currentLevel);
  });

  document.getElementById("levelsBtn").addEventListener("click", () => {
    lose.remove();
    backToLevels();
  });
}
/* ================= FIXED WIN ================= */

function createSparkles(){

  let box = document.querySelector(".winBox");

  for(let i=0;i<20;i++){

    let s = document.createElement("div");

    s.className = "sparkle";
    s.innerHTML = "✨";

    s.style.left = Math.random()*250 + "px";
    s.style.top = Math.random()*150 + "px";
    s.style.position = "absolute";

    box.appendChild(s);

    setTimeout(()=>s.remove(),1000);
  }
}

const _showWin = showWin;

showWin = function(){

  clearInterval(timerInterval);
  coins+=10;
  localStorage.setItem("coins",coins);

  _showWin();

  setTimeout(() => {

    let title = document.querySelector(".winBox h1");

    if(title){
      title.innerHTML = "🎉 Congratulations!<br>🪙coins:"+coins;
    }
    createSparkles();

  },100);
};
</script>
</body>
</html>
