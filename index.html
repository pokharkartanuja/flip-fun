<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FlipFun - Memory Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background: #0a0e27;
            overflow: hidden;
            position: fixed;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== START SCREEN ===== */
        #startScreen {
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            z-index: 10;
            overflow: hidden;
            top: 0;
            left: 0;
        }

        .stars {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        #emojiBoard {
            position: absolute;
            width: min(90vw, 400px);
            height: min(90vw, 400px);
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 6px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 25px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            animation: float 4s ease-in-out infinite;
            top: 5%;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .cell {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(16px, 5vw, 28px);
            animation: bounce 1.5s ease-in-out infinite;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .game-title {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(48px, 12vw, 90px);
            font-weight: 800;
            color: white;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.4), 0 8px 16px rgba(0, 0, 0, 0.3);
            z-index: 2;
            margin-top: 80px;
            margin-bottom: 20px;
            animation: titlePulse 2s ease-in-out infinite;
            letter-spacing: 2px;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: clamp(14px, 4vw, 18px);
            margin-bottom: 40px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .play-btn {
            font-size: clamp(16px, 4vw, 24px);
            padding: clamp(14px, 3vw, 18px) clamp(40px, 10vw, 70px);
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: white;
            font-weight: 700;
            z-index: 2;
            cursor: pointer;
            animation: pulse 1.5s infinite;
            box-shadow: 0 10px 30px rgba(0, 153, 255, 0.4);
            transition: all 0.2s;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 1px;
        }

        .play-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 15px rgba(0, 153, 255, 0.6);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* ===== LEVEL SCREEN ===== */
        #levelScreen {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0f3460 0%, #16213e 50%, #0f3460 100%);
            padding: clamp(15px, 4vw, 30px);
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 10;
            top: 0;
            left: 0;
        }

        #levelScreen h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(32px, 8vw, 50px);
            color: white;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
            margin: 20px 0 30px;
            text-align: center;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(70px, 1fr));
            gap: 12px;
            max-width: 90vw;
            margin: 0 auto 40px;
        }

        .level-btn {
            padding: clamp(12px, 3vw, 16px);
            border-radius: 15px;
            border: none;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: white;
            font-size: clamp(14px, 3vw, 16px);
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 153, 255, 0.3);
            font-family: 'Poppins', sans-serif;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .level-btn:active:not(.locked) {
            transform: scale(0.95);
            box-shadow: 0 8px 20px rgba(0, 153, 255, 0.5);
        }

        .level-btn.locked {
            background: linear-gradient(135deg, #555, #333);
            color: #999;
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* ===== GAME SCREEN ===== */
        #gameScreen {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #0f3460 0%, #16213e 100%);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
            top: 0;
            left: 0;
            padding: clamp(10px, 2vw, 15px);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 100vw;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        #levelTitle {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(20px, 5vw, 32px);
            color: white;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            font-weight: 700;
            margin: 0;
        }

        .timer {
            font-size: clamp(18px, 4vw, 28px);
            font-weight: 700;
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        #gameBoard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: clamp(8px, 2vw, 12px);
            padding: clamp(10px, 2vw, 15px);
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            border: 2px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            max-width: 90vw;
            aspect-ratio: 1;
        }

        .tile {
            aspect-ratio: 1;
            cursor: pointer;
            perspective: 1000px;
            min-width: 50px;
        }

        .tile-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform-style: preserve-3d;
        }

        .tile.flipped .tile-inner {
            transform: rotateY(180deg);
        }

        .tile-face {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            font-size: clamp(28px, 8vw, 40px);
            backface-visibility: hidden;
            font-weight: 600;
        }

        .tile-front {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: white;
            font-size: clamp(18px, 5vw, 24px);
            font-weight: 800;
            box-shadow: 0 5px 15px rgba(0, 153, 255, 0.3);
        }

        .tile-back {
            background: linear-gradient(135deg, #ffd700, #ffb700);
            transform: rotateY(180deg);
            box-shadow: 0 5px 15px rgba(255, 183, 0, 0.3);
        }

        .game-controls {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .game-controls button {
            padding: 10px 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-size: clamp(12px, 3vw, 14px);
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 5px 12px rgba(0, 153, 255, 0.3);
        }

        .game-controls button:active {
            transform: scale(0.95);
        }

        /* ===== WIN SCREEN ===== */
        #winScreen {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 999;
            top: 0;
            left: 0;
        }

        .win-box {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            padding: clamp(30px, 5vw, 50px);
            border-radius: 30px;
            text-align: center;
            color: white;
            animation: winPop 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            max-width: 90vw;
        }

        @keyframes winPop {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .win-box h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(36px, 8vw, 60px);
            margin-bottom: 15px;
            font-weight: 800;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .win-box p {
            font-size: clamp(16px, 4vw, 22px);
            margin: 15px 0;
            font-weight: 600;
        }

        .win-box button {
            margin: 8px;
            padding: clamp(12px, 2vw, 15px) clamp(20px, 5vw, 30px);
            font-size: clamp(14px, 3vw, 16px);
            border: none;
            border-radius: 15px;
            background: white;
            color: #0099ff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            font-family: 'Poppins', sans-serif;
        }

        .win-box button:active {
            transform: scale(0.95);
        }

        /* ===== LOSE SCREEN ===== */
        #loseScreen {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 999;
            top: 0;
            left: 0;
        }

        .lose-box {
            background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
            padding: clamp(30px, 5vw, 50px);
            border-radius: 30px;
            text-align: center;
            color: white;
            animation: loseShake 0.4s;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
            max-width: 90vw;
        }

        @keyframes loseShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15px); }
            75% { transform: translateX(15px); }
        }

        .lose-box h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(36px, 8vw, 60px);
            margin-bottom: 15px;
            font-weight: 800;
        }

        .lose-box p {
            font-size: clamp(16px, 4vw, 20px);
            margin: 15px 0;
            font-weight: 600;
        }

        .lose-box button {
            margin: 8px;
            padding: clamp(12px, 2vw, 15px) clamp(20px, 5vw, 30px);
            font-size: clamp(14px, 3vw, 16px);
            border: none;
            border-radius: 15px;
            background: white;
            color: #ee5a6f;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Poppins', sans-serif;
        }

        .lose-box button:active {
            transform: scale(0.95);
        }

        /* ===== CONFETTI ===== */
        #confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 998;
        }

        /* ===== MOBILE OPTIMIZATION ===== */
        @media (max-width: 768px) {
            #gameBoard {
                grid-template-columns: repeat(4, 1fr);
            }

            .level-grid {
                grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
                gap: 8px;
            }
        }

        @media (max-width: 480px) {
            #gameBoard {
                grid-template-columns: repeat(4, 1fr);
            }

            .level-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 6px;
            }

            #levelScreen h1 {
                margin: 15px 0 20px;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.5);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 212, 255, 0.8);
        }
    </style>
</head>
<body>

<!-- START SCREEN -->
<div id="startScreen">
    <div id="emojiBoard"></div>
    <h1 class="game-title">FlipFun</h1>
    <p class="subtitle">Memory Challenge for Everyone</p>
    <button class="play-btn" onclick="goToLevels()">🎮 PLAY NOW</button>
</div>

<!-- LEVEL SCREEN -->
<div id="levelScreen">
    <h1>🎯 Select Your Level</h1>
    <div class="level-grid" id="levelGrid"></div>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen">
    <div class="game-header">
        <h2 id="levelTitle">Level 1</h2>
        <div class="timer" id="timer">⏳ 2:00</div>
    </div>
    <div id="gameBoard"></div>
    <div class="game-controls">
        <button onclick="pauseGame()">⏸ Pause</button>
        <button onclick="restartGame()">🔄 Restart</button>
        <button onclick="goToLevels()">📋 Levels</button>
    </div>
</div>

<!-- WIN SCREEN -->
<div id="winScreen">
    <canvas id="confetti"></canvas>
    <div class="win-box">
        <h1>🎉 AMAZING! 🎉</h1>
        <p id="coinText">🪙 +10 Coins!</p>
        <p id="levelText" style="font-size: clamp(14px, 3vw, 18px); opacity: 0.9;">Level Complete</p>
        <button onclick="nextLevel()">⭐ Next Level</button>
        <button onclick="goToLevels()">📋 Select Level</button>
    </div>
</div>

<!-- LOSE SCREEN -->
<div id="loseScreen">
    <div class="lose-box">
        <h1>⏰ TIME'S UP!</h1>
        <p>Don't worry, try again!</p>
        <button onclick="restartGame()">🔄 Retry</button>
        <button onclick="goToLevels()">📋 Select Level</button>
    </div>
</div>

<script>
    // ===== GAME STATE =====
    let gameState = {
        currentLevel: 1,
        unlockedLevel: parseInt(localStorage.getItem('unlockedLevel')) || 1,
        coins: parseInt(localStorage.getItem('coins')) || 0,
        selected: [],
        gameRunning: false,
        gamePaused: false,
        timeLeft: 0,
        timerInterval: null,
        matchedCount: 0
    };

    const emojis = ['🍎', '🍌', '🍇', '🍒', '🍉', '🍍', '🥝', '🍑'];
    const startEmojis = ['🍎', '🍌', '🍇', '🍒', '🍉', '🍍', '🥝', '🍑', '🐱', '🐶', '⚽', '🚗', '🎈', '🎨', '🌟', '🎪', '🎭', '🎸', '🎲', '🎯'];

    // ===== INITIALIZATION =====
    function initializeStartScreen() {
        const board = document.getElementById('emojiBoard');
        board.innerHTML = '';
        for (let i = 0; i < 25; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.textContent = startEmojis[Math.floor(Math.random() * startEmojis.length)];
            board.appendChild(cell);
        }
    }

    // Add stars to start screen
    function createStars() {
        const startScreen = document.getElementById('startScreen');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'stars';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            startScreen.appendChild(star);
        }
    }

    createStars();
    initializeStartScreen();

    // ===== NAVIGATION =====
    function goToLevels() {
        clearGameTimer();
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('levelScreen').style.display = 'block';
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('winScreen').style.display = 'none';
        document.getElementById('loseScreen').style.display = 'none';
        generateLevelGrid();
    }

    function startGame(level) {
        if (level > gameState.unlockedLevel) return;
        
        gameState.currentLevel = level;
        gameState.selected = [];
        gameState.gameRunning = true;
        gameState.gamePaused = false;
        gameState.matchedCount = 0;
        
        document.getElementById('levelScreen').style.display = 'none';
        document.getElementById('gameScreen').style.display = 'flex';
        document.getElementById('winScreen').style.display = 'none';
        document.getElementById('loseScreen').style.display = 'none';
        
        document.getElementById('levelTitle').textContent = 'Level ' + level;
        createGameBoard();
        startGameTimer();
    }

    function nextLevel() {
        if (gameState.currentLevel < 100) {
            startGame(gameState.currentLevel + 1);
        } else {
            alert('🏆 Congratulations! You completed all 100 levels!');
            goToLevels();
        }
    }

    function restartGame() {
        startGame(gameState.currentLevel);
    }

    function pauseGame() {
        gameState.gamePaused = !gameState.gamePaused;
    }

    // ===== LEVEL GENERATION =====
    function generateLevelGrid() {
        const grid = document.getElementById('levelGrid');
        grid.innerHTML = '';
        
        for (let i = 1; i <= 100; i++) {
            const btn = document.createElement('button');
            btn.className = 'level-btn';
            
            if (i <= gameState.unlockedLevel) {
                btn.textContent = i;
                btn.onclick = () => startGame(i);
            } else {
                btn.textContent = '🔒';
                btn.className = 'level-btn locked';
            }
            
            grid.appendChild(btn);
        }
    }

    // ===== GAME BOARD =====
    function createGameBoard() {
        const board = document.getElementById('gameBoard');
        board.innerHTML = '';
        gameState.selected = [];
        
        let tiles = [];
        for (let i = 0; i < 8; i++) {
            tiles.push(emojis[i], emojis[i]);
        }
        tiles.sort(() => Math.random() - 0.5);
        
        tiles.forEach((emoji, index) => {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.innerHTML = `
                <div class="tile-inner">
                    <div class="tile-face tile-front">?</div>
                    <div class="tile-face tile-back">${emoji}</div>
                </div>
            `;
            
            tile.dataset.emoji = emoji;
            tile.dataset.index = index;
            tile.onclick = () => flipTile(tile);
            
            board.appendChild(tile);
        });
    }

    function flipTile(tile) {
        if (gameState.gamePaused || gameState.selected.length >= 2 || tile.classList.contains('flipped')) return;
        
        tile.classList.add('flipped');
        gameState.selected.push(tile);
        
        if (gameState.selected.length === 2) {
            setTimeout(checkMatch, 600);
        }
    }

    function checkMatch() {
        const [tile1, tile2] = gameState.selected;
        const match = tile1.dataset.emoji === tile2.dataset.emoji;
        
        if (!match) {
            tile1.classList.remove('flipped');
            tile2.classList.remove('flipped');
        } else {
            gameState.matchedCount++;
        }
        
        gameState.selected = [];
        checkWin();
    }

    function checkWin() {
        const allTiles = document.querySelectorAll('.tile');
        const flippedTiles = document.querySelectorAll('.tile.flipped');
        
        if (allTiles.length === flippedTiles.length && flippedTiles.length > 0) {
            showWinScreen();
        }
    }

    // ===== WIN/LOSE SCREENS =====
    function showWinScreen() {
        clearGameTimer();
        gameState.gameRunning = false;
        
        gameState.coins += 10;
        localStorage.setItem('coins', gameState.coins);
        
        if (gameState.currentLevel === gameState.unlockedLevel && gameState.unlockedLevel < 100) {
            gameState.unlockedLevel++;
            localStorage.setItem('unlockedLevel', gameState.unlockedLevel);
        }
        
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('winScreen').style.display = 'flex';
        document.getElementById('coinText').textContent = '🪙 +10 Coins! Total: ' + gameState.coins + ' 🪙';
        
        startConfetti();
    }

    function showLoseScreen() {
        clearGameTimer();
        gameState.gameRunning = false;
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('loseScreen').style.display = 'flex';
    }

    // ===== TIMER =====
    function getTimeLimit(level) {
        if (level <= 20) return 120;
        if (level <= 50) return 150;
        if (level <= 80) return 200;
        return 240;
    }

    function startGameTimer() {
        clearGameTimer();
        gameState.timeLeft = getTimeLimit(gameState.currentLevel);
        updateTimerDisplay();
        
        gameState.timerInterval = setInterval(() => {
            if (gameState.gamePaused) return;
            
            gameState.timeLeft--;
            updateTimerDisplay();
            
            if (gameState.timeLeft <= 0) {
                showLoseScreen();
            }
        }, 1000);
    }

    function clearGameTimer() {
        if (gameState.timerInterval) {
            clearInterval(gameState.timerInterval);
            gameState.timerInterval = null;
        }
    }

    function updateTimerDisplay() {
        const mins = Math.floor(gameState.timeLeft / 60);
        const secs = gameState.timeLeft % 60;
        document.getElementById('timer').textContent = `⏳ ${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // ===== CONFETTI =====
    function startConfetti() {
        const canvas = document.getElementById('confetti');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const particles = [];
        for (let i = 0; i < 80; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 4 + 2,
                vx: (Math.random() - 0.5) * 6,
                vy: Math.random() * 4 + 2,
                color: ['#FFD700', '#FF6B6B', '#00d4ff', '#00FF00', '#FF00FF'][Math.floor(Math.random() * 5)],
                life: 1
            });
        }
        
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(p => {
                p.y += p.vy;
                p.x += p.vx;
                p.vy += 0.15;
                p.life -= 0.01;
                
                if (p.y > canvas.height) p.y = -10;
                if (p.x > canvas.width) p.x = -10;
                if (p.x < 0) p.x = canvas.width;
                
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.globalAlpha = 1;
            });
            
            if (particles.some(p => p.life > 0)) {
                requestAnimationFrame(animate);
            }
        }
        
        animate();
    }

    // Prevent zoom on double tap
    document.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1) {
            e.preventDefault();
        }
    }, { passive: false });
</script>
