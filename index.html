<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip-Fun - Memory Game for Kids</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            overflow: hidden;
            background: #000;
        }

        /* ===== START SCREEN ===== */
        #startScreen {
            position: fixed;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 10;
            overflow: hidden;
        }

        #emojiBoard {
            position: absolute;
            width: 500px;
            height: 500px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 8px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .cell {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .game-title {
            font-family: 'Bangers', cursive;
            font-size: 100px;
            color: white;
            text-shadow: 0 0 30px #00e5ff, 0 0 60px #ff00ff;
            z-index: 2;
            margin-bottom: 30px;
            animation: titleBounce 1s ease-in-out infinite;
        }

        @keyframes titleBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .play-btn {
            font-size: 28px;
            padding: 20px 80px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #ffdd00, #ff7b00);
            color: #000;
            font-weight: bold;
            z-index: 2;
            cursor: pointer;
            animation: buttonPulse 1.5s infinite;
            box-shadow: 0 10px 30px rgba(255, 123, 0, 0.5);
            transition: transform 0.2s;
        }

        .play-btn:hover {
            transform: scale(1.1);
        }

        .play-btn:active {
            transform: scale(0.95);
        }

        @keyframes buttonPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* ===== LEVEL SCREEN ===== */
        #levelScreen {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #FFD700 0%, #87CEEB 100%);
            padding: 30px;
            overflow-y: auto;
            z-index: 10;
        }

        #levelScreen h1 {
            font-family: 'Bangers', cursive;
            font-size: 70px;
            color: white;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 40px;
            text-align: center;
        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 15px;
            max-width: 800px;
            margin: 0 auto 50px;
        }

        .level-btn {
            padding: 20px;
            border-radius: 15px;
            border: none;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .level-btn:hover:not(.locked) {
            transform: scale(1.15) rotate(3deg);
            box-shadow: 0 10px 25px rgba(255, 165, 0, 0.5);
        }

        .level-btn.locked {
            background: linear-gradient(135deg, #999, #666);
            color: white;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* ===== GAME SCREEN ===== */
        #gameScreen {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #87CEEB 0%, #FFD700 100%);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 10;
        }

        #gameScreen h2 {
            font-family: 'Bangers', cursive;
            font-size: 50px;
            color: white;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }

        #gameBoard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 20px;
            background: linear-gradient(135deg, #8b5a2b, #a0724a);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .tile {
            width: 80px;
            height: 80px;
            cursor: pointer;
            perspective: 1000px;
        }

        .tile-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .tile.flipped .tile-inner {
            transform: rotateY(180deg);
        }

        .tile-face {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            font-size: 40px;
            backface-visibility: hidden;
        }

        .tile-front {
            background: linear-gradient(135deg, #d2a679, #e6c9a0);
            color: #8b5a2b;
            font-weight: bold;
        }

        .tile-back {
            background: linear-gradient(135deg, #fff3d1, #ffe8a0);
            transform: rotateY(180deg);
        }

        /* ===== WIN SCREEN ===== */
        #winScreen {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .win-box {
            background: linear-gradient(135deg, #ffdd00, #ff7b00, #ff1493);
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            color: white;
            animation: winPop 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        @keyframes winPop {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .win-box h1 {
            font-family: 'Bangers', cursive;
            font-size: 70px;
            margin-bottom: 20px;
        }

        .win-box button {
            margin: 10px;
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #ff7b00;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .win-box button:hover {
            transform: scale(1.1);
        }

        /* ===== LOSE SCREEN ===== */
        #loseScreen {
            display: none;
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .lose-box {
            background: linear-gradient(135deg, #FF6B6B, #FF8E8E);
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            color: white;
            animation: loseShake 0.4s;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        }

        @keyframes loseShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-20px); }
            75% { transform: translateX(20px); }
        }

        .lose-box h1 {
            font-family: 'Bangers', cursive;
            font-size: 70px;
            margin-bottom: 20px;
        }

        .lose-box button {
            margin: 10px;
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #FF6B6B;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .lose-box button:hover {
            transform: scale(1.1);
        }

        /* ===== CONTROLS ===== */
        .controls {
            position: fixed;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .controls button {
            padding: 10px 20px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .controls button:hover {
            transform: scale(1.1);
        }

        .timer {
            position: fixed;
            top: 80px;
            right: 15px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            z-index: 100;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .game-title {
                font-size: 60px;
            }

            #gameBoard {
                grid-template-columns: repeat(3, 1fr);
            }

            .tile {
                width: 60px;
                height: 60px;
            }

            .tile-face {
                font-size: 30px;
            }

            .win-box, .lose-box {
                padding: 30px;
            }

            .win-box h1, .lose-box h1 {
                font-size: 50px;
            }
        }

        #confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 998;
        }
    </style>
</head>
<body>

<!-- START SCREEN -->
<div id="startScreen">
    <div id="emojiBoard"></div>
    <div class="game-title">FLIP-FUN</div>
    <button class="play-btn" onclick="goToLevels()">🎮 PLAY 🎮</button>
</div>

<!-- LEVEL SCREEN -->
<div id="levelScreen">
    <h1>🎯 Select Your Level 🎯</h1>
    <div class="level-grid" id="levelGrid"></div>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen">
    <h2 id="levelTitle">Level 1</h2>
    <div id="gameBoard"></div>
    <div class="controls">
        <button onclick="pauseGame()">⏸ Pause</button>
        <button onclick="restartGame()">🔄 Restart</button>
        <button onclick="goToLevels()">📋 Levels</button>
    </div>
    <div class="timer" id="timer"></div>
</div>

<!-- WIN SCREEN -->
<div id="winScreen">
    <canvas id="confetti"></canvas>
    <div class="win-box">
        <h1>🎉 LEVEL COMPLETE! 🎉</h1>
        <p id="coinText" style="font-size: 28px; margin: 20px 0;"></p>
        <button onclick="nextLevel()">⭐ Next Level ⭐</button>
        <button onclick="goToLevels()">📋 Select Level 📋</button>
    </div>
</div>

<!-- LOSE SCREEN -->
<div id="loseScreen">
    <div class="lose-box">
        <h1>⏰ TIME'S UP! ⏰</h1>
        <p style="font-size: 24px; margin: 20px 0;">Don't worry, try again!</p>
        <button onclick="restartGame()">🔄 Retry</button>
        <button onclick="goToLevels()">📋 Select Level 📋</button>
    </div>
</div>

<script>
// ===== GAME STATE =====
let gameState = {
    currentLevel: 1,
    unlockedLevel: parseInt(localStorage.getItem('unlockedLevel')) || 1,
    coins: parseInt(localStorage.getItem('coins')) || 0,
    selected: [],
    gameRunning: false,
    gamePaused: false,
    timeLeft: 0,
    timerInterval: null
};

const emojis = ['🍎', '🍌', '🍇', '🍒', '🍉', '🍍', '🥝', '🍑'];
const startEmojis = ['🍎', '🍌', '🍇', '🍒', '🍉', '🍍', '🥝', '🍑', '🐱', '🐶', '⚽', '🚗', '🎈', '🎨', '🌟', '🎪'];

// ===== INITIALIZATION =====
function initializeStartScreen() {
    const board = document.getElementById('emojiBoard');
    board.innerHTML = '';
    for (let i = 0; i < 25; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.textContent = startEmojis[Math.floor(Math.random() * startEmojis.length)];
        board.appendChild(cell);
    }
}

initializeStartScreen();

// ===== NAVIGATION =====
function goToLevels() {
    clearGameTimer();
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('levelScreen').style.display = 'block';
    document.getElementById('gameScreen').style.display = 'none';
    document.getElementById('winScreen').style.display = 'none';
    document.getElementById('loseScreen').style.display = 'none';
    generateLevelGrid();
}

function startGame(level) {
    if (level > gameState.unlockedLevel) return;
    
    gameState.currentLevel = level;
    gameState.selected = [];
    gameState.gameRunning = true;
    gameState.gamePaused = false;
    
    document.getElementById('levelScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'flex';
    document.getElementById('winScreen').style.display = 'none';
    document.getElementById('loseScreen').style.display = 'none';
    
    document.getElementById('levelTitle').textContent = '🎮 Level ' + level;
    createGameBoard();
    startGameTimer();
}

function nextLevel() {
    if (gameState.currentLevel < 100) {
        startGame(gameState.currentLevel + 1);
    } else {
        alert('🏆 Congratulations! You completed all levels!');
        goToLevels();
    }
}

function restartGame() {
    startGame(gameState.currentLevel);
}

function pauseGame() {
    gameState.gamePaused = !gameState.gamePaused;
}

// ===== LEVEL GENERATION =====
function generateLevelGrid() {
    const grid = document.getElementById('levelGrid');
    grid.innerHTML = '';
    
    for (let i = 1; i <= 100; i++) {
        const btn = document.createElement('button');
        btn.className = 'level-btn';
        
        if (i <= gameState.unlockedLevel) {
            btn.textContent = '⭐ ' + i;
            btn.onclick = () => startGame(i);
        } else {
            btn.textContent = '🔒';
            btn.className = 'level-btn locked';
        }
        
        grid.appendChild(btn);
    }
}

// ===== GAME BOARD =====
function createGameBoard() {
    const board = document.getElementById('gameBoard');
    board.innerHTML = '';
    gameState.selected = [];
    
    let tiles = [];
    for (let i = 0; i < 8; i++) {
        tiles.push(emojis[i], emojis[i]);
    }
    tiles.sort(() => Math.random() - 0.5);
    
    tiles.forEach((emoji, index) => {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.innerHTML = `
            <div class="tile-inner">
                <div class="tile-face tile-front">❓</div>
                <div class="tile-face tile-back">${emoji}</div>
            </div>
        `;
        
        tile.dataset.emoji = emoji;
        tile.dataset.index = index;
        tile.onclick = () => flipTile(tile);
        
        board.appendChild(tile);
    });
}

function flipTile(tile) {
    if (gameState.gamePaused || gameState.selected.length >= 2 || tile.classList.contains('flipped')) return;
    
    tile.classList.add('flipped');
    gameState.selected.push(tile);
    
    if (gameState.selected.length === 2) {
        setTimeout(checkMatch, 600);
    }
}

function checkMatch() {
    const [tile1, tile2] = gameState.selected;
    const match = tile1.dataset.emoji === tile2.dataset.emoji;
    
    if (!match) {
        tile1.classList.remove('flipped');
        tile2.classList.remove('flipped');
    }
    
    gameState.selected = [];
    checkWin();
}

function checkWin() {
    const allTiles = document.querySelectorAll('.tile');
    const flippedTiles = document.querySelectorAll('.tile.flipped');
    
    if (allTiles.length === flippedTiles.length) {
        showWinScreen();
    }
}

// ===== WIN/LOSE SCREENS =====
function showWinScreen() {
    clearGameTimer();
    gameState.gameRunning = false;
    
    gameState.coins += 10;
    localStorage.setItem('coins', gameState.coins);
    
    if (gameState.currentLevel === gameState.unlockedLevel && gameState.unlockedLevel < 100) {
        gameState.unlockedLevel++;
        localStorage.setItem('unlockedLevel', gameState.unlockedLevel);
    }
    
    document.getElementById('gameScreen').style.display = 'none';
    document.getElementById('winScreen').style.display = 'flex';
    document.getElementById('coinText').textContent = '🪙 +10 Coins! Total: ' + gameState.coins + ' 🪙';
    
    startConfetti();
}

function showLoseScreen() {
    clearGameTimer();
    gameState.gameRunning = false;
    document.getElementById('gameScreen').style.display = 'none';
    document.getElementById('loseScreen').style.display = 'flex';
}

// ===== TIMER =====
function getTimeLimit(level) {
    if (level <= 30) return 120;
    if (level <= 70) return 240;
    return 300;
}

function startGameTimer() {
    clearGameTimer();
    gameState.timeLeft = getTimeLimit(gameState.currentLevel);
    updateTimerDisplay();
    
    gameState.timerInterval = setInterval(() => {
        if (gameState.gamePaused) return;
        
        gameState.timeLeft--;
        updateTimerDisplay();
        
        if (gameState.timeLeft <= 0) {
            showLoseScreen();
        }
    }, 1000);
}

function clearGameTimer() {
    if (gameState.timerInterval) {
        clearInterval(gameState.timerInterval);
        gameState.timerInterval = null;
    }
}

function updateTimerDisplay() {
    const mins = Math.floor(gameState.timeLeft / 60);
    const secs = gameState.timeLeft % 60;
    document.getElementById('timer').textContent = `⏳ ${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

// ===== CONFETTI =====
function startConfetti() {
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    const particles = [];
    for (let i = 0; i < 100; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 5 + 2,
            vx: (Math.random() - 0.5) * 8,
            vy: Math.random() * 5 + 3,
            color: 'hsl(' + Math.random() * 360 + ', 100%, 50%)'
        });
    }
    
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        particles.forEach(p => {
            p.y += p.vy;
            p.x += p.vx;
            p.vy += 0.1;
            
            if (p.y > canvas.height) p.y = -10;
            if (p.x > canvas.width) p.x = -10;
            if (p.x < 0) p.x = canvas.width;
            
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        
        requestAnimationFrame(animate);
    }
    
    animate();
}
</script>

</body>
</html>
